<div class="api-shell">
  <app-top-toolbar
    context="api"
    [forceScrolled]="true"
    [isDocsMenuOpen]="isMobileDocsMenuOpen"
    (docsMenuClick)="toggleMobileDocsMenu()">
  </app-top-toolbar>

  <main class="api-page docs-layout">
    <div class="docs-sidebar-shell">
      <app-api-docs-sidebar
        [kicker]="'LunarChain'"
        [title]="'Docs'"
        [items]="sidebarItems">
      </app-api-docs-sidebar>
    </div>

    <section class="docs-main">
      <router-outlet></router-outlet>
    </section>

    <aside class="docs-outline-shell" *ngIf="currentOutline.length">
      <div class="docs-outline">
        <p class="outline-title">On this page</p>
        <nav class="outline-nav" aria-label="On this page">
          <a
            *ngFor="let item of currentOutline"
            class="outline-link"
            [attr.href]="buildSectionHref(item.id)"
            [class.active]="item.id === activeOutlineId"
            (click)="onOutlineClick($event, item.id)">
            {{ item.label }}
          </a>
        </nav>
      </div>
    </aside>
  </main>

  <div class="docs-mobile-overlay" [class.open]="isMobileDocsMenuOpen" (click)="closeMobileDocsMenu()"></div>
  <aside
    id="docs-mobile-navigation"
    class="docs-mobile-drawer"
    [class.open]="isMobileDocsMenuOpen"
    role="dialog"
    [attr.aria-modal]="isMobileDocsMenuOpen ? 'true' : null"
    aria-labelledby="docs-mobile-navigation-title"
    [attr.aria-hidden]="!isMobileDocsMenuOpen"
    [attr.inert]="isMobileDocsMenuOpen ? null : ''">
    <div class="docs-mobile-header">
      <span id="docs-mobile-navigation-title" class="docs-mobile-title">Docs</span>
      <button class="docs-mobile-close-btn" type="button" aria-label="Close documentation navigation" (click)="closeMobileDocsMenu()">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>
    <div class="docs-mobile-body">
      <a class="docs-mobile-home-btn" routerLink="/" (click)="closeMobileDocsMenu()">
        Back to site
      </a>
      <a class="docs-mobile-home-btn" routerLink="/pricing" (click)="closeMobileDocsMenu()">
        Pricing
      </a>
      <app-api-docs-sidebar
        class="docs-mobile-sidebar"
        [kicker]="'LunarChain'"
        [title]="'Docs'"
        [variant]="'light'"
        [items]="sidebarItems">
      </app-api-docs-sidebar>
    </div>
  </aside>
</div>
