<footer class="landing-footer" [class.landing-footer--light]="variant === 'light'">
  <div class="footer-content">
    <div class="footer-main">
      <div class="footer-brand">
        <img src="assets/logo/Logo_no_text-removebg-preview.png" alt="LunarChain Logo" class="footer-logo">
        <div class="footer-brand-text">
          <h3>LunarChain</h3>
          <p>Intelligence built for high-demand environments.</p>
        </div>
      </div>

      <nav class="footer-links" aria-label="Footer navigation">
        @for (link of footerLinks; track trackFooterLink($index, link)) {
          @if (link.type === 'landing') {
            <button
              type="button"
              (click)="navigateToLanding(link.target)">
              {{ link.label }}
            </button>
          }
          @if (link.type === 'route') {
            <a
              [routerLink]="link.routerLink"
              [attr.aria-current]="getAriaCurrent(link)">
              {{ link.label }}
            </a>
          }
        }
      </nav>
    </div>

    <div class="footer-bottom">
      <div class="footer-bottom-content">
        <div class="footer-copyright">
          <p>&copy; 2026 LunarChain. All rights reserved.</p>
        </div>

        @if (showSocial) {
          <div class="footer-social">
            <a href="https://linkedin.com/company/lunarchain" target="_blank" rel="noopener" class="social-link" aria-label="LinkedIn">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false">
                <path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433c-1.144 0-2.063-.926-2.063-2.065 0-1.138.92-2.063 2.063-2.063 1.14 0 2.064.925 2.064 2.063 0 1.139-.925 2.065-2.064 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/>
              </svg>
            </a>
          </div>
        }
      </div>
    </div>
  </div>
</footer>
