@if (context === 'api') {
  <header class="docs-toolbar">
    <button type="button" class="docs-brand" aria-label="LunarChain home" (click)="onBrandClick()">
      <img src="assets/logo/Logo_no_text-removebg-preview.png" alt="LunarChain Logo" class="toolbar-logo docs-toolbar-logo">
      <span class="docs-logo-text">LunarChain Docs</span>
    </button>
    <nav class="docs-desktop-nav" aria-label="Primary">
      @for (item of apiNavItems; track trackNavItem($index, item)) {
        <button
          type="button"
          class="docs-nav-link"
          [class.docs-nav-link--active]="isActionActive(item.action)"
          (click)="onAction(item.action)">
          {{ item.label }}
        </button>
      }
      <a class="docs-login-link" [href]="loginUrl">Log In</a>
    </nav>
    <div class="docs-mobile-nav">
      <button
        class="docs-mobile-icon-btn"
        type="button"
        aria-label="Open documentation navigation"
        aria-controls="docs-mobile-navigation"
        [attr.aria-expanded]="isDocsMenuOpen"
        (click)="onDocsMenuClick()">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    </div>
  </header>
} @else {
  <div
    class="landing-taskbar"
    [class.scrolled]="taskbarScrolled"
    [class.no-transition]="disableTransitions">
    <button type="button" class="brand-container" aria-label="Back to top of LunarChain landing page" (click)="onBrandClick()">
      <img src="assets/logo/Logo_no_text-removebg-preview.png" alt="LunarChain Logo" class="toolbar-logo">
      <span class="logo-text">LunarChain</span>
    </button>
    <span class="spacer"></span>
    <div class="desktop-nav">
      @for (item of landingNavItems; track trackNavItem($index, item)) {
        <button
          type="button"
          class="nav-btn"
          [class.active]="isActionActive(item.action)"
          (click)="onAction(item.action)">
          {{ item.label }}
        </button>
      }
      <a class="login-btn" [href]="loginUrl">Log In</a>
    </div>
    <div class="mobile-nav">
      <button
        class="mobile-icon-btn"
        type="button"
        aria-label="Open menu"
        aria-controls="landing-mobile-menu"
        [attr.aria-expanded]="isMobileMenuOpen"
        (click)="toggleMobileMenu()">
        <mat-icon aria-hidden="true">menu</mat-icon>
      </button>
    </div>
  </div>
  <aside
    id="landing-mobile-menu"
    class="mobile-side-menu"
    [class.open]="isMobileMenuOpen"
    role="dialog"
    [attr.aria-modal]="isMobileMenuOpen ? 'true' : null"
    aria-labelledby="landing-mobile-menu-title"
    [attr.aria-hidden]="!isMobileMenuOpen"
    [attr.inert]="isMobileMenuOpen ? null : ''">
    <div class="mobile-menu-header">
      <span id="landing-mobile-menu-title" class="mobile-menu-title">Menu</span>
      <button class="close-btn" type="button" aria-label="Close menu" (click)="toggleMobileMenu()">
        <mat-icon aria-hidden="true">close</mat-icon>
      </button>
    </div>
    <div class="mobile-menu-items">
      @for (item of landingNavItems; track trackNavItem($index, item)) {
        <button
          type="button"
          class="mobile-menu-btn"
          [class.active]="isActionActive(item.action)"
          (click)="onAction(item.action)">
          {{ item.label }}
        </button>
      }
    </div>
  </aside>
  <div class="mobile-menu-overlay" [class.active]="isMobileMenuOpen" (click)="toggleMobileMenu()"></div>
}
